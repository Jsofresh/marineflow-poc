name: quality-gates

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: marineflow
          POSTGRES_PASSWORD: marineflow_dev
          POSTGRES_DB: marineflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marineflow -d marineflow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql://marineflow:marineflow_dev@localhost:5432/marineflow_test
      INTERNAL_WORKER_SECRET: test-worker-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Prisma migrate + seed
        run: |
          npx prisma migrate deploy
          npm run db:seed

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Prisma validate
        run: npx prisma validate

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E smoke
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          DATABASE_URL: postgresql://marineflow:marineflow_dev@localhost:5432/marineflow_test
        run: |
          npm run build
          npm run start &
          npx wait-on http://127.0.0.1:3000/api/health
          npm run test:e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: |
            app/playwright-report
            app/test-results
